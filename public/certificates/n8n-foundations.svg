<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      .cert-title { font-family: 'Inter', sans-serif; font-weight: 800; fill: #0f172a; font-size: 42px; font-style: italic; }
      .cert-sub { font-family: 'Inter', sans-serif; font-weight: 700; fill: #1e293b; font-size: 20px; }
      .label { font-family: 'Inter', sans-serif; font-weight: 500; fill: #64748b; font-size: 16px; }
      .name { font-family: 'Inter', sans-serif; font-weight: 800; fill: #0f172a; font-size: 38px; }
      .course { font-family: 'Inter', sans-serif; font-weight: 800; fill: #0f172a; font-size: 26px; }
      .details { font-family: 'Inter', sans-serif; font-weight: 500; fill: #475569; font-size: 16px; }
      .footer-label { font-family: 'Inter', sans-serif; font-weight: 700; fill: #64748b; font-size: 10px; letter-spacing: 1.5px; }
      .footer-val { font-family: 'Inter', sans-serif; font-weight: 500; fill: #334155; font-size: 11px; }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1000" height="700" fill="#f8fafc"/>
  <rect x="25" y="25" width="950" height="650" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="2"/>

  <!-- n8n Brand Accents -->
  <!-- Subtle background angled shape -->
  <path d="M 620 25 L 975 25 L 975 675 L 560 675 Z" fill="#f8fafc" opacity="0.6"/>

  <!-- Top Right n8n Logo -->
  <g transform="translate(770, 75)">
    <!-- n8n Node Graphic -->
    <path d="M 10 20 Q 30 0 50 20 Q 70 40 90 20" stroke="#ff6d5a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="10" cy="20" r="7" fill="#ff6d5a"/>
    <circle cx="50" cy="20" r="7" fill="#ff6d5a"/>
    <circle cx="90" cy="20" r="7" fill="#ff6d5a"/>
    <text x="110" y="28" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#0f172a">n8n</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(85, 110)">
    <text x="0" y="30" class="cert-title">Professional</text>
    <text x="0" y="65" class="cert-sub">Certificate</text>

    <text x="0" y="140" class="label">This is to certify that</text>
    <text x="0" y="195" class="name">Rezaul Hoque</text>

    <text x="0" y="260" class="details">successfully completed all courses and received</text>
    <text x="0" y="285" class="details">passing grades for a Professional Certificate in</text>

    <text x="0" y="350" class="course">n8n Foundations &amp; Workflow Automation</text>

    <text x="0" y="410" class="details">a program offered by n8n, in collaboration with n8n Platform.</text>
  </g>

  <!-- Signature Section -->
  <g transform="translate(720, 260)">
    <!-- Small n8n logo mark -->
    <path d="M 0 10 Q 15 0 30 10 Q 45 20 60 10" stroke="#ff6d5a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="5" fill="#ff6d5a"/>
    <circle cx="30" cy="10" r="5" fill="#ff6d5a"/>
    <circle cx="60" cy="10" r="5" fill="#ff6d5a"/>
    <text x="75" y="16" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#0f172a">n8n</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#475569">n8n Education Team</text>
    <text x="0" y="58" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#94a3b8">n8n Academy</text>
  </g>

  <!-- Footer Metadata -->
  <g transform="translate(85, 600)">
    <line x1="0" y1="0" x2="830" y2="0" stroke="#f1f5f9" stroke-width="1.5"/>
    
    <g transform="translate(0, 25)">
      <text x="0" y="0" class="footer-label">ISSUED</text>
      <text x="0" y="16" class="footer-val">August 2026</text>
    </g>

    <g transform="translate(220, 25)">
      <text x="0" y="0" class="footer-label">VALID CERTIFICATE ID</text>
      <text x="0" y="16" class="footer-val">e8a073e1f4ef4986999c7d7265b4ea85</text>
    </g>

    <g transform="translate(600, 25)">
      <text x="0" y="0" class="footer-label">ISSUING ORGANIZATION</text>
      <text x="0" y="16" class="footer-val">n8n Academy / n8n Platform</text>
    </g>
  </g>
</svg>
